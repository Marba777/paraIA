<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parakeet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:         rgba(8, 8, 12, 0.82);
      --border:     rgba(255,255,255,0.08);
      --text:       #f0f0f0;
      --text-dim:   rgba(255,255,255,0.35);
      --accent:     #4ade80;
      --accent-dim: rgba(74,222,128,0.15);
      --warn:       #fbbf24;
      --error:      #f87171;
      --radius:     12px;
      --font-size:  13px;
    }

    /* ── Themes ── */
    body.theme-dark  { --bg: rgba(8,8,12,0.82);       --text: #f0f0f0; }
    body.theme-light { --bg: rgba(245,245,250,0.92);   --text: #111;    --text-dim: rgba(0,0,0,0.4); --border: rgba(0,0,0,0.1); }
    body.theme-blue  { --bg: rgba(10,20,50,0.88);      --text: #cce;    --accent: #60a5fa; --accent-dim: rgba(96,165,250,0.15); }
    body.theme-green { --bg: rgba(5,20,10,0.88);       --text: #cfd;    --accent: #4ade80; }

    body {
      background: transparent;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow: hidden;
    }

    .container {
      background: var(--bg);
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      cursor: grab;
      height: 22px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .brand-name {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .container:hover .controls { opacity: 1; }

    .btn-icon {
      background: none;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-dim);
      transition: background 0.15s, color 0.15s;
    }

    .btn-icon:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    /* ── Status row ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 18px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.connected   { background: var(--accent); }
    .status-dot.listening   { background: var(--accent); animation: pulse 1.2s infinite; }
    .status-dot.transcribing{ background: var(--warn);   animation: pulse 0.6s infinite; }
    .status-dot.thinking    { background: var(--warn);   animation: pulse 0.9s infinite; }
    .status-dot.error       { background: var(--error); }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }

    .status-text {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      flex: 1;
    }

    .ct-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--accent-dim);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
      white-space: nowrap;
    }

    /* ── Transcript ── */
    .transcript-box {
      font-size: 11px;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.3;
      max-height: 32px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: none;
      flex-shrink: 0;
    }

    .transcript-box.visible { display: block; }

    /* ── Response box ── */
    .response-box {
      font-size: var(--font-size);
      color: var(--text);
      line-height: 1.55;
      flex: 1;
      overflow-y: auto;
      word-break: break-word;
      font-family: 'Inter', sans-serif;
      padding-right: 4px;
      min-height: 40px;
    }

    .response-box.empty {
      color: var(--text-dim);
      font-style: italic;
    }

    .response-box::-webkit-scrollbar       { width: 3px; }
    .response-box::-webkit-scrollbar-track { background: transparent; }
    .response-box::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; opacity: 0.6; }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      vertical-align: text-bottom;
      border-radius: 1px;
      margin-left: 2px;
      animation: blink 1s infinite;
    }

    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }

    /* ── Mode pills ── */
    .mode-row {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .container:hover .mode-row { opacity: 1; }

    .mode-pill {
      font-size: 10px;
      padding: 2px 9px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-pill.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .mode-pill:hover:not(.active) {
      border-color: rgba(255,255,255,0.25);
      color: var(--text);
    }
  </style>
</head>
<body class="theme-dark">
  <div class="container">

    <div class="topbar">
      <div class="brand">
        <span style="font-size:14px">🦜</span>
        <span class="brand-name">Parakeet</span>
      </div>
      <div class="controls">
        <button class="btn-icon" id="btn-clear"    title="Limpiar">✕</button>
        <button class="btn-icon" id="btn-settings" title="Configuración (Ctrl+Shift+S)">⚙</button>
      </div>
    </div>

    <div class="status-row">
      <div class="status-dot" id="dot"></div>
      <span class="status-text" id="status-text">desconectado</span>
      <span class="ct-badge" id="ct-badge">click-through ON</span>
    </div>

    <div class="transcript-box" id="transcript"></div>

    <div class="response-box empty" id="response">
      Habla para activar Parakeet...
    </div>

    <div class="mode-row">
      <div class="mode-pill active" data-mode="copilot">copiloto</div>
      <div class="mode-pill"        data-mode="translate">traducir</div>
      <div class="mode-pill"        data-mode="summarize">resumir</div>
      <div class="mode-pill"        data-mode="code">código</div>
    </div>

  </div>

  <script>
    // ── Elementos ──────────────────────────────────────────────────────
    const dot        = document.getElementById('dot')
    const statusText = document.getElementById('status-text')
    const responseEl = document.getElementById('response')
    const transcript = document.getElementById('transcript')
    const ctBadge    = document.getElementById('ct-badge')

    // ── Estado ────────────────────────────────────────────────────────
    let ws          = null
    let WS_URL      = 'ws://localhost:8765'
    let activeMode  = 'copilot'
    let isStreaming = false

    // ── Scroll ────────────────────────────────────────────────────────
    function forceScroll() {
      responseEl.scrollTop = responseEl.scrollHeight
    }

    const scrollObserver = new MutationObserver(() => {
      if (isStreaming) forceScroll()
    })
    scrollObserver.observe(responseEl, { childList: true, subtree: true, characterData: true })

    // ── Status helper ─────────────────────────────────────────────────
    function setStatus(state, label) {
      dot.className  = 'status-dot ' + state
      statusText.textContent = label
    }

    // ── Mode pills ────────────────────────────────────────────────────
    document.querySelectorAll('.mode-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.mode-pill').forEach(p => p.classList.remove('active'))
        pill.classList.add('active')
        activeMode = pill.dataset.mode
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'set-mode', mode: activeMode }))
        }
      })
    })

    // ── Buttons ───────────────────────────────────────────────────────
    document.getElementById('btn-clear').addEventListener('click', () => {
      responseEl.innerHTML = 'Habla para activar Parakeet...'
      responseEl.classList.add('empty')
      transcript.classList.remove('visible')
    })

    document.getElementById('btn-settings').addEventListener('click', () => {
      if (window.parakeet?.openSettings) window.parakeet.openSettings()
    })

    // ── Parakeet IPC listeners ─────────────────────────────────────────
    if (window.parakeet) {
      window.parakeet.onClickThrough?.(active => {
        ctBadge.textContent = active ? 'click-through ON' : 'click-through OFF'
        ctBadge.style.background = active ? 'rgba(74,222,128,0.15)' : 'rgba(251,191,36,0.15)'
        ctBadge.style.color      = active ? 'var(--accent)'         : 'var(--warn)'
      })

      window.parakeet.onOpacity?.(v => {
        document.documentElement.style.setProperty('--bg', `rgba(8,8,12,${v/100})`)
      })

      window.parakeet.onFontSize?.(v => {
        document.documentElement.style.setProperty('--font-size', v + 'px')
      })

      window.parakeet.onTheme?.(t => {
        document.body.className = 'theme-' + t
      })

      window.parakeet.onSystemPrompt?.(prompt => {
        if (ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'set-system-prompt', prompt }))
        }
      })

      window.parakeet.onModel?.(model => {
        if (ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'set-model', model }))
        }
      })

      window.parakeet.onWhisperUrl?.(url => {
        // Solo log — el bridge usa su propia URL de Whisper
        console.log('Whisper URL:', url)
      })

      window.parakeet.onOllamaUrl?.(url => {
        if (ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'set-ollama-url', url }))
        }
      })
    }

    // ── WebSocket ─────────────────────────────────────────────────────
    function connect() {
      ws = new WebSocket(WS_URL)

      ws.onopen = () => {
        statusText.style.color = ''
        setStatus('connected', 'conectado · 🎤 escuchando')
        ws.send(JSON.stringify({ type: 'set-mode', mode: activeMode }))
      }

      ws.onmessage = (e) => {
        if (typeof e.data !== 'string') return
        let msg
        try { msg = JSON.parse(e.data) } catch { return }

        switch (msg.type) {
          case 'listening':
            if (!isStreaming) setStatus('listening', 'escuchando... 🎙️')
            break

          case 'transcribing':
            setStatus('transcribing', 'transcribiendo...')
            break

          case 'transcript':
            transcript.textContent = '🎤 ' + msg.text
            transcript.classList.add('visible')
            setStatus('thinking', 'pensando...')
            break

          case 'thinking':
            setStatus('thinking', 'generando respuesta...')
            break

          case 'response':
            isStreaming = true
            responseEl.classList.remove('empty')
            responseEl.innerHTML = escapeHtml(msg.text) + '<span class="cursor"></span>'
            forceScroll()
            break

          case 'done':
            isStreaming = false
            responseEl.querySelector('.cursor')?.remove()
            setStatus('listening', 'escuchando... 🎙️')
            forceScroll()
            break

          case 'error':
            setStatus('error', msg.text || 'error desconocido')
            break

          case 'mode_changed':
            document.querySelectorAll('.mode-pill').forEach(p => {
              p.classList.toggle('active', p.dataset.mode === msg.mode)
            })
            break
        }
      }

      ws.onclose = () => {
        setStatus('', 'reconectando...')
        statusText.style.color = 'rgba(251,191,36,0.7)'
        setTimeout(connect, 2500)
      }

      ws.onerror = () => setStatus('error', 'error de conexión')
    }

    // Escapar HTML en respuestas para evitar XSS
    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>')
    }

    // Iniciar conexión al bridge
    connect()

    window.addEventListener('beforeunload', () => ws?.close())
  </script>
</body>
</html>
